<title>Character Lab</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  /* Layout: a turntable stage fills the screen. Design tabs across the top, the chosen design's name and notes bottom-left, pose buttons bottom-right. Single dark studio look by design. */
  --bg:#15171c;
  --panel:rgba(14,16,21,.82);
  --line:rgba(255,255,255,.15);
  --text:#e6e9ee;
  --dim:#9aa2ae;
  --accent:#ff9a52;
  --pick:#7fd4ff;
  --font-hud:"Chakra Petch","Rajdhani",ui-sans-serif,system-ui,sans-serif;
  --font-body:"Barlow",ui-sans-serif,system-ui,sans-serif;
  --font-news:"Oswald","Arial Narrow",ui-sans-serif,system-ui,sans-serif;
  --gut-l:max(16px,env(safe-area-inset-left,0px));
  --gut-r:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box;background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font-body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:absolute;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 38%,#2b2f38,#121318 75%)}
#cv,#ov{position:absolute;inset:0;width:100%;height:100%;display:block}
#cv{pointer-events:none}
#ov{touch-action:none;cursor:grab}
#busy{position:absolute;left:0;right:0;top:46%;display:grid;place-items:center;font-family:var(--font-hud);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);z-index:1;pointer-events:none}
#nogl{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--dim);z-index:9}
button{font-family:var(--font-hud);font-weight:600;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:6px;min-height:36px;padding:0 11px;cursor:pointer;white-space:nowrap}
button:focus-visible{outline:2px solid var(--pick);outline-offset:2px}
button.on{border-color:var(--accent);color:#ffd2ae;background:rgba(60,32,16,.85)}

.head{display:flex;align-items:baseline;gap:10px;pointer-events:none!important}
.head h1{margin:0;font-family:var(--font-news);font-weight:700;font-size:20px;letter-spacing:.08em;text-transform:uppercase}
.head span{font-size:12.5px;color:var(--dim)}
#tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}

#info .n{font-family:var(--font-hud);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}

  #poses{left:var(--gut-l);right:var(--gut-r);grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:max-content;justify-content:start;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}#poses::-webkit-scrollbar{display:none}.lbl span{display:none}}

<div id="stage">

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
/* ===== 00-core.js ===== */
"use strict";
/* Core: constants, helpers, renderer, geometry merging. Units are about 10 cm. World x = east, y = south (three.js z). */
const W=720,H=1440,PI=Math.PI,TAU=PI*2;
const $=s=>document.querySelector(s);
const hyp=Math.hypot,clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,k)=>a+(b-a)*k,rand=(a,b)=>a+Math.random()*(b-a),pick=a=>a[(Math.random()*a.length)|0];

const damp=(a,b,k,dt)=>a+(b-a)*(1-Math.exp(-k*dt));
const ease=k=>k<=0?0:k>=1?1:k*k*(3-2*k);
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const COL={you:'#7fd4ff',ally:'#ffc35c',zed:'#ff5a48',good:'#6fe39a',warn:'#ffd24a',bad:'#ff5a48'};
const HUDFONT='"Chakra Petch","Rajdhani",ui-sans-serif,system-ui,sans-serif';
const stage=$('#stage'),cv=$('#cv'),ov=$('#ov'),ox=ov.getContext('2d');
let cw=1,ch=1,dpr=1;

const T=window.THREE;
if(!T){$('#nogl').hidden=false;return;}
let renderer;
try{renderer=new T.WebGLRenderer({canvas:cv,antialias:true,powerPreference:'high-performance'});}
catch(e){$('#nogl').hidden=false;return;}

renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene();
const FOGC=0x45343f;
scene.fog=new T.FogExp2(FOGC,0.00135);scene.background=new T.Color(FOGC);
const camera=new T.PerspectiveCamera(42,1,4,6000);

/* quality steps down by itself if the frame rate is poor: 3 = bloom + big shadows, 2 = no bloom, 1 = small shadows + lower res, 0 = no shadows */
const Q={level:3,auto:!window.__noScale,acc:0,n:0,warm:0};

/* ---- geometry merging: many coloured boxes become one mesh with vertex colours ---- */
const _m4=new T.Matrix4(),_e=new T.Euler(),_q=new T.Quaternion(),_s1=new T.Vector3(1,1,1),_p=new T.Vector3(),_n3=new T.Matrix3(),_c=new T.Color(),_v=new T.Vector3();
function part(g,x,y,z,c,rx,ry,rz){return{g,x,y,z,c,rx,ry,rz};}
function bx(w,h,d,x,y,z,c,rx,ry,rz){return part(new T.BoxGeometry(w,h,d),x,y,z,c,rx,ry,rz);}
function cy(rt,rb,h,seg,x,y,z,c,rx,ry,rz){return part(new T.CylinderGeometry(rt,rb,h,seg),x,y,z,c,rx,ry,rz);}
function merge(items,uvScale){
  let n=0,ni=0;
  for(const it of items){const g=it.g;if(!g.attributes.normal)g.computeVertexNormals();n+=g.attributes.position.count;ni+=g.index?g.index.count:g.attributes.position.count;}
  const P=new Float32Array(n*3),N=new Float32Array(n*3),K=new Float32Array(n*3),U=new Float32Array(n*2),I=new (n>65535?Uint32Array:Uint16Array)(ni);
  let vo=0,io=0;
  for(const it of items){
    const g=it.g,pa=g.attributes.position,na=g.attributes.normal,ix=g.index;
    _m4.compose(_p.set(it.x||0,it.y||0,it.z||0),_q.setFromEuler(_e.set(it.rx||0,it.ry||0,it.rz||0)),_s1);
    _n3.getNormalMatrix(_m4);_c.set(it.c===undefined?0xffffff:it.c).convertSRGBToLinear();
    for(let i=0;i<pa.count;i++){
      const o=(vo+i)*3;
      _v.fromBufferAttribute(pa,i).applyMatrix4(_m4);P[o]=_v.x;P[o+1]=_v.y;P[o+2]=_v.z;
      const px=_v.x,py=_v.y,pz=_v.z;
      _v.fromBufferAttribute(na,i).applyMatrix3(_n3).normalize();N[o]=_v.x;N[o+1]=_v.y;N[o+2]=_v.z;
      if(it.keep&&g.attributes.color){const ka=g.attributes.color;K[o]=ka.getX(i);K[o+1]=ka.getY(i);K[o+2]=ka.getZ(i);}else{K[o]=_c.r;K[o+1]=_c.g;K[o+2]=_c.b;}
      if(uvScale){const o2=(vo+i)*2;
        if(Math.abs(_v.y)>.6){U[o2]=px*uvScale;U[o2+1]=pz*uvScale;}
        else if(Math.abs(_v.x)>.6){U[o2]=pz*uvScale;U[o2+1]=py*uvScale;}
        else{U[o2]=px*uvScale;U[o2+1]=py*uvScale;}}
    }
    if(ix)for(let i=0;i<ix.count;i++)I[io++]=ix.array[i]+vo;else for(let i=0;i<pa.count;i++)I[io++]=vo+i;
    vo+=pa.count;g.dispose();
  }
  const out=new T.BufferGeometry();
  out.setAttribute('position',new T.BufferAttribute(P,3));out.setAttribute('normal',new T.BufferAttribute(N,3));out.setAttribute('color',new T.BufferAttribute(K,3));

  out.setIndex(new T.BufferAttribute(I,1));return out;
}
/* gable roof: ridge along x */
function roofGeo(L,Wd,h){
  const a=L/2,b=Wd/2,v=[
    -a,0,b, a,0,b, a,h,0,  -a,0,b, a,h,0, -a,h,0,
    a,0,-b, -a,0,-b, -a,h,0,  a,0,-b, -a,h,0, a,h,0,
    -a,0,-b, -a,0,b, -a,h,0,  a,0,b, a,0,-b, a,h,0];
  const g=new T.BufferGeometry();g.setAttribute('position',new T.BufferAttribute(new Float32Array(v),3));g.computeVertexNormals();return g;
}
function canvasTex(w,h,draw,norepeat){
  const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
  const t=new T.CanvasTexture(c);if(!norepeat)t.wrapS=t.wrapT=T.RepeatWrapping;t.encoding=T.sRGBEncoding;t.anisotropy=4;return t;
}

/* ===== 50-figures.js ===== */
/* Figures: every person and zombie in the game, sculpted in code.
   A body is described as one solid (trunk, limbs, hands and head blended into each other like clay) and a surface is
   wrapped round that solid, so shoulders, hips, neck and wrists flow together with no seams. Clothes and the face are
   painted on afterwards as a texture. There are two builds (Bryan picked them in the character lab): "brawler" and "slim".
   Everyone is one of those with their own sizes, head, outfit and colours. The named cast gets a fine wrap; zombies and
   bystanders come from a small pool of coarse ones, sculpted once and shared between look-alikes.
   The character lab (first-light/lab) is built from this same file. */
const PK=['by','br','lean','twist','hz','hy','sLz','sLx','sRz','sRx','eL','eR','wR','hL','hR','kL','kR'];
const BONE={body:0,hips:1,chest:2,head:3,sL:4,eL:5,haL:6,sR:7,eR:8,haR:9,hL:10,kL:11,hR:12,kR:13,faL:14,fbL:15,thL:16,faR:17,fbR:18,thR:19};
function vmat(o){return new T.MeshStandardMaterial(Object.assign({vertexColors:true,roughness:.86,metalness:0},o||{}));}
const _k1=new T.Color();
const lin=(hex,out)=>(out||_k1).set(hex).convertSRGBToLinear();
const css=h=>'#'+h.toString(16).padStart(6,'0');
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
/* smooth lookup: rows are [key,...values]; every column is interpolated with a cubic through its neighbours */
function tabS(pts,f){
  const n=pts.length,asc=pts[0][0]<pts[n-1][0],lo=asc?0:n-1,hi=asc?n-1:0;
  if(f<=pts[lo][0])return pts[lo];if(f>=pts[hi][0])return pts[hi];
  let i=0;for(;i<n-2;i++){const a=pts[i][0],b=pts[i+1][0];if((f>=a&&f<=b)||(f<=a&&f>=b))break;}
  const p1=pts[i],p2=pts[i+1],p0=pts[i-1]||p1,p3=pts[i+2]||p2,h=p2[0]-p1[0],t=(f-p1[0])/h,t2=t*t,t3=t2*t,o=[f];
  const h00=2*t3-3*t2+1,h10=t3-2*t2+t,h01=-2*t3+3*t2,h11=t3-t2;
  for(let k=1;k<p1.length;k++){
    const m1=p0===p1?(p2[k]-p1[k])/h:(p2[k]-p0[k])/(p2[0]-p0[0]),m2=p3===p2?(p2[k]-p1[k])/h:(p3[k]-p1[k])/(p3[0]-p1[0]);
    o.push(h00*p1[k]+h10*h*m1+h01*p2[k]+h11*h*m2);
  }
  return o;
}

/* ================= 1. solids ================= */
const BIG=9;
/* union of two shapes with the join rounded over a distance k */
const smin=(a,b,k)=>{if(k<1e-4)return a<b?a:b;const h=Math.max(k-Math.abs(a-b),0)/k;return Math.min(a,b)-h*h*k*.25;};
/* a limb or trunk as a run of rounded cross-sections. rows are [t, c, rA, rB, rz, n].
   ax 'y': t = height, c = centre x, rA/rB = front/back reach, rz = half width, n = 2 for an ellipse, more for boxier.
   ax 'x': t = x, c = centre y, rA/rB = up/down reach. z0 is the centre line's z. */
function loft(ax,rows,z0,pad){
  const N=120,ka=rows[0][0],kb=rows[rows.length-1][0],lo=Math.min(ka,kb),hi=Math.max(ka,kb),st=(hi-lo)/N,D=new Float32Array((N+1)*5),vert=ax==='y';
  let c0=1e9,c1=-1e9,zm=0;pad=pad||1.2;
  for(let i=0;i<=N;i++){const p=tabS(rows,lo+st*i),a=i*5;D[a]=p[1];D[a+1]=Math.max(.012,p[2]);D[a+2]=Math.max(.012,p[3]);D[a+3]=Math.max(.012,p[4]);D[a+4]=p[5]||2;
    c0=Math.min(c0,p[1]-D[a+2]);c1=Math.max(c1,p[1]+D[a+1]);zm=Math.max(zm,D[a+3]);}
  // how fast the centre and the radii change along the axis, for turning the radial measure into a true distance
  const G=new Float32Array((N+1)*4);for(let i=0;i<=N;i++){const a=Math.max(0,i-1)*5,b=Math.min(N,i+1)*5,h=(b-a)/5*st;for(let k=0;k<4;k++)G[i*4+k]=(D[b+k]-D[a+k])/h;}
  return{d(px,py,pz){
    const t=vert?py:px,u=vert?px:py;
    if(t<lo-pad||t>hi+pad||u<c0-pad||u>c1+pad||pz<z0-zm-pad||pz>z0+zm+pad)return BIG;
    const tc=t<lo?lo:t>hi?hi:t,f=(tc-lo)/st,i=f>=N?N-1:f|0,w=f-i,a=i*5,g=i*4,fr=u-(D[a]+(D[a+5]-D[a])*w)>=0?1:2;
    const du=u-(D[a]+(D[a+5]-D[a])*w),dv=pz-z0,ru=D[a+fr]+(D[a+5+fr]-D[a+fr])*w,rv=D[a+3]+(D[a+8]-D[a+3])*w,n=D[a+4]+(D[a+9]-D[a+4])*w;
    const qu=Math.abs(du)/ru,qv=Math.abs(dv)/rv,rho=n<2.0001?Math.sqrt(qu*qu+qv*qv):Math.pow(Math.pow(qu,n)+Math.pow(qv,n),1/n),len=Math.sqrt(du*du+dv*dv);
    let dr=-Math.min(ru,rv);
    if(rho>1e-5){const cu=du/len,cv=dv/len,sl=(G[g+fr]+(G[g+4+fr]-G[g+fr])*w)*cu*cu+(G[g+3]+(G[g+7]-G[g+3])*w)*cv*cv+(G[g]+(G[g+4]-G[g])*w)*cu;dr=(len-len/rho)/Math.sqrt(1+sl*sl);}
    if(t!==tc){const da=Math.abs(t-tc);dr=dr>0?Math.sqrt(dr*dr+da*da):da;}
    else{const e=t-lo<hi-t?lo-t:t-hi;if(e>dr)dr=e;}
    return dr;
  }};
}
function ell(cx,cy_,cz,rx,ry,rz,rotZ,rotY){
  const cZ=Math.cos(rotZ||0),sZ=Math.sin(rotZ||0),cY=Math.cos(rotY||0),sY=Math.sin(rotY||0),R=Math.max(rx,ry,rz)+1.2,R2=R*R,rm=Math.min(rx,ry,rz);
  return{d(px,py,pz){
    const x=px-cx,y=py-cy_,z=pz-cz;if(x*x+y*y+z*z>R2)return BIG;
    const x1=x*cY-z*sY,z1=x*sY+z*cY,x2=x1*cZ+y*sZ,y2=-x1*sZ+y*cZ,a=x2/rx,b=y2/ry,c=z1/rz,k0=Math.sqrt(a*a+b*b+c*c),k1=Math.sqrt(a*a/(rx*rx)+b*b/(ry*ry)+c*c/(rz*rz));
    return k1<1e-9?-rm:k0*(k0-1)/k1;
  }};
}
function cone(ax,ay,az,bx_,by_,bz,r1,r2){
  const dx=bx_-ax,dy=by_-ay,dz=bz-az,L2=dx*dx+dy*dy+dz*dz||1e-9,mx=(ax+bx_)/2,my=(ay+by_)/2,mz=(az+bz)/2,R=Math.sqrt(L2)/2+Math.max(r1,r2)+1.2,R2=R*R;
  return{d(px,py,pz){
    const ex=px-mx,ey=py-my,ez=pz-mz;if(ex*ex+ey*ey+ez*ez>R2)return BIG;
    const x=px-ax,y=py-ay,z=pz-az;let t=(x*dx+y*dy+z*dz)/L2;t=t<0?0:t>1?1:t;
    const qx=x-dx*t,qy=y-dy*t,qz=z-dz*t;return Math.sqrt(qx*qx+qy*qy+qz*qz)-(r1+(r2-r1)*t);
  }};
}
/* everything on the side of a tilted plane that (nx,ny) points to: used to cut the hairline */
function half(x0,y0,nx,ny){return{d(x,y){return-((x-x0)*nx+(y-y0)*ny);}};}
/* a solid is a list of shapes. Each is blended into what is already there over its own distance k (a number, or a function of
   position so a limb can melt into the trunk at its root and stay separate further down), and each says which bones move it. */
function Solid(){this.P=[];this.dv=[];}
Solid.prototype.add=function(p,k,w){p.k=k;p.w=w;this.P.push(p);return p;};

  const P=this.P;let d=BIG;
  for(let i=0;i<P.length;i++){const p=P[i],v=p.d(x,y,z);if(v>BIG-1)continue;
    if(p.sub)d=-smin(-d,v,p.k);else d=smin(d,v,typeof p.k==='function'?p.k(x,y,z):p.k);}
  return d;
};
const _acc=new Float32Array(20),_sk={i:[0,0,0,0],w:[0,0,0,0]},_uv=[0,0];
/* bone weights at a point: the nearest shape decides, and shapes that are being blended in there share the vertex */
Solid.prototype.skin=function(x,y,z,o){
  const P=this.P,dv=this.dv,acc=_acc;let m=-1,dm=BIG;acc.fill(0);
  for(let i=0;i<P.length;i++){if(P[i].sub){dv[i]=BIG;continue;}const v=dv[i]=P[i].d(x,y,z);if(v<dm){dm=v;m=i;}}
  if(m<0)m=0;
  const kf=p=>p===P[0]?1e9:typeof p.k==='function'?p.k(x,y,z):p.k,km=kf(P[m]);
